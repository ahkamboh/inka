<!doctype html>
<html><head><meta charset="utf-8"><title>inkling-live</title>
<style>
  :root{ --ink:#1c1c1c; --accent:#e8730c; --muted:#7a7164; --paper:#fffdf8; }
  @font-face{font-family:'Caveat';src:url('/fonts/caveat-700.woff2') format('woff2');font-weight:700}
  @font-face{font-family:'PatrickHand';src:url('/fonts/patrick-hand.woff2') format('woff2')}
  html,body{margin:0;height:100%;background:#eae6dd;overflow:hidden}
  body{display:grid;place-items:center;font-family:'Bradley Hand','Chalkboard SE','Comic Sans MS',cursive}
  #stagewrap{position:relative;width:min(96vw,calc(96vh*16/9));aspect-ratio:16/9;background:var(--paper);
    border-radius:14px;box-shadow:0 18px 70px rgba(30,25,15,.2);overflow:hidden}
  svg{display:block;width:100%;height:100%;position:relative;z-index:2}
  .hand{font-family:'Bradley Hand','Chalkboard SE','Comic Sans MS',cursive}
  .hidden{opacity:0;pointer-events:none}

  #splash{position:absolute;inset:0;z-index:9;background:var(--paper);display:grid;place-items:center;cursor:pointer;transition:opacity .6s}
  #splash.gone{opacity:0;pointer-events:none}
  #splash .inner{text-align:center;color:var(--ink)}
  #splash h1{font-size:44px;margin:0 0 10px;font-weight:600}
  #splash p{font-size:20px;color:var(--muted);margin:6px 0}
  #tapdot{width:92px;height:92px;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;
    margin:26px auto 0;font-size:34px;animation:tap 1.6s ease-in-out infinite}
  @keyframes tap{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(232,115,12,.35)}50%{transform:scale(1.07);box-shadow:0 0 0 22px rgba(232,115,12,0)}}

  #status{position:absolute;left:26px;top:22px;z-index:4;font-size:16px;color:var(--muted);
    background:#fff;border:2px solid #e5e0d6;border-radius:10px;padding:7px 14px;opacity:0;transition:opacity .3s}
  #status.on{opacity:1}
  #status.live{color:#e23b3b;border-color:#e23b3b}

  #corner{position:absolute;right:16px;top:14px;z-index:5;display:flex;gap:8px;transition:opacity .4s}
  .btn{padding:9px 13px;font-size:15px;border:2.5px solid var(--ink);border-radius:11px;background:#fff;
    color:var(--ink);cursor:pointer;font-family:inherit;user-select:none}
  #cam.on{background:var(--accent);border-color:var(--accent);color:#fff}
  #hint{position:absolute;bottom:14px;right:20px;font-size:13px;color:#b9b2a6;z-index:5;transition:opacity .5s}

  /* slide dots + swipe feedback */
  #dots{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:5;display:flex;gap:9px;opacity:0;transition:opacity .4s}
  #dots.on{opacity:1}
  #dots .d{width:13px;height:13px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;cursor:pointer;transition:background .25s,transform .25s}
  #dots .d.cur{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
  #swipefx{position:absolute;top:50%;z-index:6;font-size:84px;color:var(--accent);opacity:0;transform:translateY(-50%);pointer-events:none;
    text-shadow:0 0 14px #fff,0 0 6px #fff}
  #swipefx.go{animation:swf .55s ease-out}
  @keyframes swf{0%{opacity:0;transform:translateY(-50%) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translateY(-50%) scale(1.25)}}

  #camfull{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:none;z-index:1}
  #stagewrap.camon{background:#101010}
  #stagewrap.camon #camfull{display:block}
  #stagewrap.camon #paper,#stagewrap.camon #grain{opacity:0}
  #stagewrap.camon #drawing, #stagewrap.camon #mascot{
    filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 3px #fff) drop-shadow(0 0 6px rgba(255,255,255,.9));}
  #stagewrap.camon #status{border-color:#fff}
  #stagewrap.camon .washel{opacity:.12!important}
  #stagewrap.camon .hiel{opacity:.3!important}
  #stagewrap.camon .noteel{opacity:.55!important}

  .breathe{transform-box:fill-box;transform-origin:center bottom;animation:br 3s ease-in-out infinite}
  @keyframes br{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.035)}}
  .eyes{transform-box:fill-box;transform-origin:center;animation:blink 3.6s infinite;transition:transform .35s}
  @keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}97%{transform:scaleY(1)}}
  .drawing .eyes{transform:translateX(5px)}
  .hop{animation:hop .55s ease-in-out 2}
  @keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-26px)}}
  .sway{transform-box:fill-box;transform-origin:center bottom;animation:sway 1.6s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
  .drawing #mascotInner{animation:lean 2.4s ease-in-out infinite}
  @keyframes lean{0%,100%{transform:rotate(2.6deg)}50%{transform:rotate(4.2deg)}}
  #mouth{transform-box:fill-box;transform-origin:center}
  .talking #mouth{animation:mouthmove .26s ease-in-out infinite}
  @keyframes mouthmove{0%,100%{transform:scaleY(1)}50%{transform:scaleY(2.3) translateY(1.5px)}}
  #thinkbubble{opacity:0;transition:opacity .4s}
  #thinkbubble.on{opacity:1}
  #thinkbubble .dots circle{animation:tdot 1.2s infinite}
  #thinkbubble .dots circle:nth-child(2){animation-delay:.2s}
  #thinkbubble .dots circle:nth-child(3){animation-delay:.4s}
  @keyframes tdot{0%,100%{opacity:.25}50%{opacity:1}}
  #armPoint{opacity:0;transition:opacity .3s}
  .pointing #armPoint{opacity:1}
  .pointing #armHold,.waving #armHold{opacity:0}
  #armHold{opacity:1;transition:opacity .3s;transform-box:fill-box;transform-origin:left center}
  .drawing #armHold{animation:scribble .5s ease-in-out infinite}
  @keyframes scribble{0%,100%{transform:rotate(0deg)}50%{transform:rotate(7deg)}}
  #armWave{opacity:0;transform-box:fill-box;transform-origin:180px 300px}
  .waving #armWave{opacity:1;animation:wavearm .6s ease-in-out 3}
  @keyframes wavearm{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-24deg)}}
  #hearing{opacity:0;transition:opacity .3s}
  #hearing.on{opacity:1}
  #hearing path{animation:tdot 1s infinite}
  #hearing path:nth-child(2){animation-delay:.25s}
  #shadow{transform-box:fill-box;transform-origin:center;animation:shbr 3s ease-in-out infinite}
  @keyframes shbr{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.05)}}
  .spark{transform-box:fill-box;transform-origin:center;animation:spark .9s ease-out forwards}
  @keyframes spark{0%{transform:scale(0) rotate(0deg);opacity:1}70%{opacity:1}100%{transform:scale(1.4) rotate(40deg);opacity:0}}

  #mascotInner,#shadow{display:none}  /* the 3D mascot replaces the flat body */
  #saywrap{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);max-width:54%;z-index:4;
    background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:7px 15px;font-size:16.5px;color:var(--ink);
    box-shadow:3px 4px 0 rgba(28,28,28,.13);opacity:0;transition:opacity .3s}
  #saywrap.on{opacity:1}
  #saywrap.you{border-color:#c9c2b4;color:var(--muted);font-size:15px}
</style></head>
<body>
<div id="stagewrap">
  <div id="splash"><div class="inner">
    <h1>👁 inkling-live</h1>
    <p>your agent draws slides while you talk — flip them with a wave of your hand</p>
    <p style="font-size:16px">tap once to wake it up (mic + voice)</p>
    <div id="tapdot">▶</div>
  </div></div>

  <div id="status" class="hand"></div>
  <div id="corner"><button id="cam" class="btn" title="camera mode: AR + hand-gesture slides">📷 camera</button></div>

  <svg id="stage" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">

        <path d="M140,202 C113,202 106,244 109,272 C110,288 124,296 140,296 C156,296 170,288 171,272 C174,244 167,202 140,202 Z"
              fill="url(#bodyGrad)" transform="scale(1.25)"/>

          <ellipse cx="22" cy="0" rx="26" ry="13" fill="#e8730c"/>
          <ellipse cx="14" cy="-6" rx="16" ry="8" fill="#f28a2e"/>

        </g>
        <g class="eyes"><circle cx="163" cy="298" r="7" fill="#fff"/><circle cx="186" cy="298" r="7" fill="#fff"/></g>
        <circle cx="151" cy="314" r="5.5" fill="#ff9a4d" opacity="0.5"/>
        <circle cx="198" cy="314" r="5.5" fill="#ff9a4d" opacity="0.5"/>

        <path d="M166,368 L164,384 M184,368 L186,384"
              fill="none" stroke="#1c1c1c" stroke-width="3.6" stroke-linecap="round"/>
        <rect x="153" y="382" width="24" height="9" rx="4.5" fill="#e8730c"/>
        <rect x="177" y="382" width="24" height="9" rx="4.5" fill="#e8730c"/>
        <path id="armPoint" d="M205,305 C228,296 248,290 268,287" fill="none" stroke="#1c1c1c" stroke-width="3.6" stroke-linecap="round"/>
        <g id="armWave">
          <path d="M200,305 C218,290 226,272 228,252" fill="none" stroke="#1c1c1c" stroke-width="3.6" stroke-linecap="round"/>
          <path d="M222,258 L228,252 L234,258 M224,247 L228,252 L233,248" fill="none" stroke="#1c1c1c" stroke-width="2.6" stroke-linecap="round"/>
        </g>
        <g id="armHold">
          <path d="M203,308 C220,304 234,300 246,296" fill="none" stroke="#1c1c1c" stroke-width="3.6" stroke-linecap="round"/>
          <g transform="translate(238,300) rotate(-52)">
            <rect x="0" y="-4.5" width="40" height="10" rx="2.5" fill="#e8730c"/>
            <rect x="0" y="-4.5" width="40" height="4" rx="2" fill="#f5a55c" opacity="0.7"/>
            <path d="M40,-4.5 L49,0.5 L40,5.5 Z" fill="#f0cfa0"/>
            <path d="M46.6,-0.8 L49,0.5 L46.6,1.9 Z" fill="#1c1c1c"/>
            <rect x="-6" y="-4.5" width="6" height="10" rx="2" fill="#c95f5f"/>
          </g>
          <circle cx="242" cy="299" r="5.5" fill="#1c1c1c"/>
        </g>
      </g>
      <g id="thinkbubble" transform="translate(265,-145)">
        <circle cx="6" cy="66" r="7" fill="none" stroke="#1c1c1c" stroke-width="2.4"/>
        <circle cx="26" cy="42" r="10" fill="none" stroke="#1c1c1c" stroke-width="2.6"/>
        <ellipse cx="72" cy="8" rx="52" ry="30" fill="none" stroke="#1c1c1c" stroke-width="3"/>
        <g class="dots" fill="#1c1c1c"><circle cx="52" cy="8" r="4.5"/><circle cx="72" cy="8" r="4.5"/><circle cx="92" cy="8" r="4.5"/></g>
      </g>
      <g id="hearing" transform="translate(305,-15)" fill="none" stroke="#e8730c" stroke-width="3.4" stroke-linecap="round">
        <path d="M0,0 C10,10 10,26 0,36"/>
        <path d="M16,-8 C32,8 32,36 16,52"/>
      </g>
      <g id="sparks"></g>
    </g>
  </svg>

  <div id="saywrap" class="hand"><span id="saytext"></span></div>
  <div id="hint">inkling-live · talk to draw · wave or say “slide 2” to flip</div>
</div>

<script type="module" src="/mascot3d.js"></script>
<script>
const SVG='http://www.w3.org/2000/svg';
const stage=document.getElementById('drawing');
const mascot=document.getElementById('mascot');
const inner=document.getElementById('mascotInner');
const bubble=document.getElementById('thinkbubble');
const hearing=document.getElementById('hearing');
const sparks=document.getElementById('sparks');
const say=document.getElementById('saywrap'), sayText=document.getElementById('saytext');
const status=document.getElementById('status'), splash=document.getElementById('splash');
const stagewrap=document.getElementById('stagewrap'), camvid=document.getElementById('camfull');
const dotsEl=document.getElementById('dots'), swipefx=document.getElementById('swipefx');

function setStatus(t,live){ if(!t){status.classList.remove('on','live');return;}
  status.textContent=t; status.classList.add('on'); status.classList.toggle('live',!!live); }

/* ---------- hand-drawn ICON library (100x100 boxes, stroke-based so they draw on) ---------- */
const ICONS={
  person:['M50,26 a12,12 0 1,0 0.1,0','M50,38 C38,44 32,56 31,74 M50,38 C62,44 68,56 69,74','M36,56 L24,66 M64,56 L76,66'],
  brain:['M38,26 C26,28 20,40 24,50 C18,58 22,70 32,73 C36,80 48,82 52,76 L52,30 C48,22 40,22 38,26','M62,26 C74,28 80,40 76,50 C82,58 78,70 68,73 C64,80 52,82 48,76','M40,40 C44,44 44,50 40,54 M60,44 C56,48 56,54 60,58'],
  lightbulb:['M50,22 C34,22 26,36 30,48 C33,57 40,60 41,68 L59,68 C60,60 67,57 70,48 C74,36 66,22 50,22','M42,76 L58,76 M44,84 L56,84','M50,6 L50,14 M24,14 L30,20 M76,14 L70,20'],
  gear:['M50,32 a18,18 0 1,0 0.1,0','M50,42 a8,8 0 1,0 0.1,0','M50,20 L50,28 M50,72 L50,80 M20,50 L28,50 M72,50 L80,50 M29,29 L35,35 M65,65 L71,71 M71,29 L65,35 M35,65 L29,71'],
  cloud:['M30,64 C18,64 16,50 26,46 C24,34 38,28 46,34 C50,24 68,26 70,38 C82,38 84,54 74,58 C72,64 64,66 58,64 Z'],
  server:['M28,24 L72,24 L72,42 L28,42 Z','M28,50 L72,50 L72,68 L28,68 Z','M36,33 L36,33.1 M36,59 L36,59.1','M58,33 L66,33 M58,59 L66,59'],
  phone:['M36,14 L64,14 L64,86 L36,86 Z','M44,20 L56,20','M50,76 a3,3 0 1,0 0.1,0'],
  laptop:['M30,26 L70,26 L70,58 L30,58 Z','M22,70 L78,70 L70,58 L30,58 Z','M44,64 L56,64'],
  chart:['M24,20 L24,78 L80,78','M34,66 L34,50 M46,66 L46,38 M58,66 L58,44 M70,66 L70,30','M30,44 C42,36 54,28 74,22 M74,22 L66,22 M74,22 L74,30'],
  magnifier:['M44,24 a20,20 0 1,0 0.1,0','M58,58 L78,78'],
  heart:['M50,78 C20,56 24,32 38,28 C46,26 50,32 50,36 C50,32 54,26 62,28 C76,32 80,56 50,78'],
  star:['M50,18 L58,40 L82,40 L62,54 L70,78 L50,63 L30,78 L38,54 L18,40 L42,40 Z'],
  database:['M30,26 C30,18 70,18 70,26 C70,34 30,34 30,26','M30,26 L30,70 C30,78 70,78 70,70 L70,26','M30,46 C30,54 70,54 70,46'],
  lock:['M34,46 L66,46 L66,80 L34,80 Z','M40,46 L40,34 C40,20 60,20 60,34 L60,46','M50,60 L50,70'],
  rocket:['M50,14 C62,26 66,44 60,62 L40,62 C34,44 38,26 50,14','M40,62 L32,76 L42,70 M60,62 L68,76 L58,70','M46,70 C48,78 52,78 54,70','M50,36 a6,6 0 1,0 0.1,0'],
  money:['M50,20 a30,30 0 1,0 0.1,0','M58,38 C54,32 42,33 42,41 C42,51 58,47 58,57 C58,65 45,66 41,60','M50,28 L50,36 M50,60 L50,70'],
};

/* ---------- mascot poses + fx ---------- */
function pose(p){
  if(window.M3D) M3D.pose(p);
  mascot.classList.remove('pointing','drawing','waving'); bubble.classList.remove('on');
  inner.classList.remove('sway','hop');
  if(p==='think'){ bubble.classList.add('on'); inner.classList.add('sway'); }
  if(p==='point'){ mascot.classList.add('pointing'); }
  if(p==='draw'){ mascot.classList.add('drawing'); }
  if(p==='wave'){ mascot.classList.add('waving'); }
  if(p==='happy'){ void inner.offsetWidth; inner.classList.add('hop'); }
}
let drawTimer=null;
function drawingFlash(){
  if(window.M3D) M3D.scribble();
  if(!mascot.classList.contains('pointing')) mascot.classList.add('drawing');
  clearTimeout(drawTimer);
  drawTimer=setTimeout(()=>mascot.classList.remove('drawing'),900);
}
function sparkle(){
  for(let i=0;i<8;i++){
    const a=Math.random()*Math.PI*2, r=90+Math.random()*70;
    const x=240+Math.cos(a)*r, y=-30+Math.sin(a)*r*0.7;
    const s=document.createElementNS(SVG,'path');
    s.setAttribute('d','M0,-7 L2,-2 L7,0 L2,2 L0,7 L-2,2 L-7,0 L-2,-2 Z');
    s.setAttribute('transform',`translate(${x},${y})`);
    s.setAttribute('fill',Math.random()<0.5?'#e8730c':'#1c1c1c');
    s.classList.add('spark'); s.style.animationDelay=(Math.random()*0.3)+'s';
    sparks.appendChild(s); setTimeout(()=>s.remove(),1400);
  }
}

/* ---------- voice ---------- */
let speaking=false, voice=null, VOICES=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices(); if(!vs.length) return;
  const enOf=v=>String(v.lang||'').replace('_','-').toLowerCase();
  const FEMALE=['samantha','google us english','microsoft aria','microsoft zira','ava','allison','susan',
                'serena','karen','moira','tessa','kate','victoria','fiona','google uk english female','martha'];
  for(const name of FEMALE){ const hit=vs.find(v=>v.name.toLowerCase().includes(name)); if(hit){ voice=hit; break; } }
  if(!voice) voice=vs.find(v=>enOf(v).startsWith('en-us')) || vs.find(v=>enOf(v).startsWith('en')) || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speakBrowser(text){
  return new Promise(res=>{
    if(!('speechSynthesis' in window)) return res();
    const u=new SpeechSynthesisUtterance(text);
    if(!voice) pickVoice(); if(voice) u.voice=voice;
    u.lang='en-US'; u.pitch=1.25; u.rate=1.04;
    let done=false; const fin=()=>{ if(done)return; done=true; res(); };
    u.onend=fin; u.onerror=fin;
    setTimeout(fin, Math.max(2500, text.length*90));
    speechSynthesis.speak(u);
  });
}
function playWav(url){
  return new Promise(res=>{
    const a=new Audio(url);
    let done=false; const fin=()=>{ if(done)return; done=true; res(); };
    a.onended=fin; a.onerror=fin; a.play().catch(fin);
    setTimeout(fin,30000);
  });
}
async function speakLine(text,audioUrl){
  speaking=true; inner.classList.add('talking'); if(window.M3D) M3D.talking(true);
  if(audioUrl) await playWav(audioUrl); else await speakBrowser(text);
  speaking=false; inner.classList.remove('talking'); if(window.M3D) M3D.talking(false);
}
let lineDone=Promise.resolve();   // resolves when the current narration line ends

/* ---------- SLIDE ENGINE ---------- */
const GAP=1700; let slides=[], cur=0, liveSlide=null;
function slideTarget(){ if(!liveSlide) newSlide(''); return liveSlide.content; }
function refreshDots(){
  dotsEl.innerHTML=''; dotsEl.classList.toggle('on',slides.length>1);
  slides.forEach((s,i)=>{ const d=document.createElement('div'); d.className='d'+(i===cur?' cur':'');
    d.title=s.title||('slide '+(i+1)); d.onclick=()=>nav(i); dotsEl.appendChild(d); });
}
function nav(i,fx){
  if(!slides.length) return;
  cur=Math.max(0,Math.min(slides.length-1,i));
  stage.style.transition='transform .55s cubic-bezier(.25,.8,.3,1)';
  stage.style.transform=`translateX(${-cur*GAP}px)`;
  refreshDots();
  if(fx){ swipefx.textContent=fx>0?'➤':'⬅'; swipefx.style[fx>0?'right':'left']='40px'; swipefx.style[fx>0?'left':'right']='auto';
    swipefx.classList.remove('go'); void swipefx.offsetWidth; swipefx.classList.add('go'); }
}
window.__nav=d=>nav(cur+d,d);
function newSlide(title){
  centerSlide(liveSlide);                       /* finished slide gets centered */
  const g=document.createElementNS(SVG,'g');
  g.setAttribute('transform',`translate(${slides.length*GAP},0)`);
  const head=document.createElementNS(SVG,'g'), content=document.createElementNS(SVG,'g');
  g.appendChild(head); g.appendChild(content);
  stage.appendChild(g);
  liveSlide={g,head,content,title}; slides.push(liveSlide);
  nav(slides.length-1);
  return liveSlide;
}
/* equal margins: measure the slide's drawn content and centre it in the free region */
function centerSlide(s){
  if(!s) return;
  let bb; try{ bb=s.content.getBBox(); }catch(e){ return; }
  if(!bb || bb.width<4 || bb.height<4) return;
  const x0=380, x1=1545, y0=s.title?215:120, y1=845;
  const dx=((x0+x1)/2)-(bb.x+bb.width/2);
  const dy=((y0+y1)/2)-(bb.y+bb.height/2);
  s.content.style.transition='transform .7s cubic-bezier(.3,.8,.3,1)';
  s.content.style.transform=`translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px)`;
}
function resetShow(){ stage.innerHTML=''; stage.style.transition='none'; stage.style.transform='translateX(0)';
  slides=[]; cur=0; liveSlide=null; refreshDots(); }

/* ---------- draw-on helpers (double-stroke ink for a real pen feel) ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function el(tag,attrs){const e=document.createElementNS(SVG,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
async function drawOn(shape,dur,target){
  drawingFlash();
  (target||slideTarget()).appendChild(shape);
  let len=1200; try{len=shape.getTotalLength();}catch(e){}
  const d=dur||Math.min(2200,Math.max(500,len*1.15));
  shape.style.strokeDasharray=len; shape.style.strokeDashoffset=len;
  shape.style.transition=`stroke-dashoffset ${d}ms ease-in-out`;
  void shape.getBoundingClientRect();
  shape.style.strokeDashoffset=0;
  await sleep(d+40);
  /* ink echo: a faint second pass, like real pen pressure */
  if(shape.tagName==='path'&&shape.getAttribute('stroke')&&len>60){
    const echo=shape.cloneNode();
    echo.style.strokeDasharray='none'; echo.style.strokeDashoffset='0'; echo.style.transition='none';
    echo.setAttribute('opacity','0.28');
    echo.setAttribute('stroke-width',Math.max(1,(parseFloat(shape.getAttribute('stroke-width')||4))*0.5));
    echo.setAttribute('transform',(shape.getAttribute('transform')||'')+' translate(1.4,1.8)');
    shape.parentNode.insertBefore(echo,shape);
  }
}
async function writeOn(t,dur,target){
  drawingFlash();
  (target||slideTarget()).appendChild(t);
  const d=dur||Math.max(420,(t.textContent||'').length*46);
  t.style.clipPath='inset(-20% 100% -20% 0)'; t.style.transition=`clip-path ${d}ms steps(${Math.max(4,(t.textContent||'').length)})`;
  void t.getBoundingClientRect();
  t.style.clipPath='inset(-20% -5% -20% 0)';
  await sleep(d+40);
}
const F_TITLE="'Caveat','Bradley Hand','Chalkboard SE',cursive";
const F_TEXT="'PatrickHand','Bradley Hand','Chalkboard SE',cursive";
function handText(attrs,content,title){
  const t=el('text',attrs);
  t.style.fontFamily=title?F_TITLE:F_TEXT;
  t.textContent=content||''; return t;
}

/* ---------- op handlers ---------- */
const H={
  async slide(c){ await lineDone;
    const sl=newSlide(c.title||'');
    if(c.title){
      const w=Math.min(760,(c.title||'').length*30), x1=960-w/2, x2=960+w/2;
      const hi=el('path',{d:`M ${x1-14} 148 Q 960 ${138+Math.random()*8} ${x2+14} 146`,
        fill:'none',stroke:'#ffd9ad','stroke-width':52,'stroke-linecap':'round',opacity:0});
      hi.classList.add('hiel');
      sl.head.appendChild(hi); hi.style.transition='opacity .5s'; void hi.getBoundingClientRect(); hi.style.opacity=0.75;
      const t=handText({x:960,y:158,'text-anchor':'middle','font-size':76,fill:'#1c1c1c','font-weight':700,
        transform:`rotate(${(Math.random()*1.6-0.8).toFixed(2)} 960 150)`},c.title,true);
      await writeOn(t,undefined,sl.head);
      await drawOn(el('path',{d:`M ${x1} 182 C ${x1+w*0.25} 175 ${x1+w*0.4} 190 ${960} 182 C ${x2-w*0.3} 175 ${x2-w*0.15} 189 ${x2} 181`,
        fill:'none',stroke:'#e8730c','stroke-width':5,'stroke-linecap':'round'}),600,sl.head); } },
  async clear(){ await H.slide({title:''}); },        /* legacy */
  async title(c){ await H.slide({title:c.text||''}); }, /* legacy */
  async say(c){ await lineDone;                     /* previous line finishes first */
    const text=String(c.text||'');
    say.classList.remove('you'); sayText.textContent=''; say.classList.add('on');
    lineDone=(async()=>{ const a=speakLine(text,c.audio||null);
      for(const ch of text){ sayText.textContent+=ch; await sleep(18); } await a; })();
    await sleep(140); },                              /* voice + the beat's drawing start TOGETHER */
  async mascot(c){ pose(c.pose||'idle'); await sleep(300); },
  async icon(c){
    const spec=ICONS[String(c.name||'').toLowerCase()]; if(!spec) return;
    const sc=(+c.scale||1.4), color=c.color||'#1c1c1c';
    const g=el('g',{transform:`translate(${(+c.x||800)-50*sc},${(+c.y||400)-50*sc}) scale(${sc}) rotate(${(Math.random()*3-1.5).toFixed(1)} 50 50)`});
    slideTarget().appendChild(g);
    const sh=el('ellipse',{cx:50,cy:104,rx:34,ry:6,fill:'#1c1c1c',opacity:0});
    g.appendChild(sh); sh.style.transition='opacity .6s'; void sh.getBoundingClientRect(); sh.style.opacity=0.10;
    for(const d of spec){
      await drawOn(el('path',{d,fill:'none',stroke:color,'stroke-width':(4.2/Math.sqrt(sc)).toFixed(2),
        'stroke-linecap':'round','stroke-linejoin':'round'}),Math.min(700,220+d.length*3),g);
    } },
  async note(c){
    const {x=900,y=250,w=240,h=110}=c, tilt=(Math.random()*3-1.5).toFixed(1);
    const g=el('g',{transform:`rotate(${tilt} ${x+w/2} ${y+h/2})`});
    slideTarget().appendChild(g);
    const bg=el('rect',{x,y,width:w,height:h,rx:6,fill:'#ffd9ad',stroke:'#e8730c','stroke-width':3});
    bg.classList.add('noteel');
    bg.style.opacity=0; g.appendChild(bg);
    bg.style.transition='opacity .4s'; void bg.getBoundingClientRect(); bg.style.opacity=0.92;
    const tape=el('rect',{x:x+w/2-45,y:y-12,width:90,height:24,rx:3,fill:'#e8730c',opacity:0,
      transform:`rotate(${(Math.random()*8-4).toFixed(1)} ${x+w/2} ${y})`});
    g.appendChild(tape); tape.style.transition='opacity .4s'; void tape.getBoundingClientRect(); tape.style.opacity=0.35;
    await sleep(320);
    const words=String(c.text||'').split(' '); const lines=[]; let line='';
    for(const wd of words){ if((line+' '+wd).trim().length>Math.floor(w/13)){ lines.push(line.trim()); line=wd; } else line+=' '+wd; }
    if(line.trim()) lines.push(line.trim());
    for(let i=0;i<lines.length&&i<4;i++){
      await writeOn(handText({x:x+16,y:y+34+i*26,'font-size':22,fill:'#1c1c1c'},lines[i]),undefined,g);
    } },
  async path(c){ await drawOn(el('path',{d:c.d,fill:c.fill||'none',stroke:c.stroke||'#1c1c1c',
      'stroke-width':c.width||4,'stroke-linecap':'round','stroke-linejoin':'round'}),c.dur); },
  async circle(c){ await drawOn(el('circle',{cx:c.cx,cy:c.cy,r:c.r,fill:c.fill||'none',stroke:c.stroke||'#1c1c1c','stroke-width':c.width||4}),c.dur); },
  async rect(c){ await drawOn(el('rect',{x:c.x,y:c.y,width:c.w,height:c.h,rx:c.rx??12,fill:c.fill||'none',stroke:c.stroke||'#1c1c1c','stroke-width':c.width||4,
      transform:`rotate(${(Math.random()*1.6-0.8).toFixed(2)} ${(+c.x)+(+c.w)/2} ${(+c.y)+(+c.h)/2})`}),c.dur); },
  async arrow(c){ const {x1,y1,x2,y2}=c, mx=(+x1+ +x2)/2+((+y2-+y1)*0.06), my=(+y1+ +y2)/2-((+x2-+x1)*0.06);
    await drawOn(el('path',{d:`M ${x1} ${y1} Q ${mx} ${my} ${x2} ${y2}`,fill:'none',stroke:c.stroke||'#1c1c1c','stroke-width':c.width||4,'stroke-linecap':'round'}),c.dur);
    const a=Math.atan2(y2-my,x2-mx), L=16;
    await drawOn(el('path',{d:`M ${x2-L*Math.cos(a-0.5)} ${y2-L*Math.sin(a-0.5)} L ${x2} ${y2} L ${x2-L*Math.cos(a+0.5)} ${y2-L*Math.sin(a+0.5)}`,
      fill:'none',stroke:c.stroke||'#1c1c1c','stroke-width':c.width||4,'stroke-linecap':'round'}),240); },
  async text(c){ await writeOn(handText({x:c.x,y:c.y,'font-size':c.size||30,fill:c.color||'#1c1c1c',
      transform:`rotate(${(Math.random()*3-1.5).toFixed(2)} ${c.x} ${c.y})`},c.text)); },
  async wash(c){ // soft pastel blob grounding a composition — depth without noise
    const colors={orange:'#ffe3c4',cream:'#fff3dd',grey:'#eee9df'};
    const w=el('ellipse',{cx:c.x||960,cy:c.y||480,rx:c.rx||300,ry:c.ry||210,fill:colors[c.color]||colors.orange,opacity:0});
    w.classList.add('washel');
    slideTarget().appendChild(w); w.style.transition='opacity .8s'; void w.getBoundingClientRect(); w.style.opacity=0.55;
    await sleep(500); },
  async step(c){ // numbered hand-drawn step chip: ① ② ③
    const {x=500,y=400,n=1}=c;
    const g=el('g',{transform:`rotate(${(Math.random()*4-2).toFixed(1)} ${x} ${y})`});
    slideTarget().appendChild(g);
    await drawOn(el('circle',{cx:x,cy:y,r:30,fill:'#fff',stroke:'#e8730c','stroke-width':4.5}),380,g);
    await writeOn(handText({x,y:y+11,'text-anchor':'middle','font-size':34,fill:'#e8730c','font-weight':700},String(n),true),240,g);
    if(c.text) await writeOn(handText({x:x+46,y:y+10,'font-size':30,fill:'#1c1c1c'},c.text),undefined,g); },
  async accent(c){ // tiny ink sparkles/dashes to garnish a spot — use sparingly
    const {x=900,y=300}=c; const g=el('g',{});
    slideTarget().appendChild(g);
    for(let i=0;i<3;i++){ const a=(-0.4+i*0.5)+Math.random()*0.2, r1=18+Math.random()*8, r2=r1+16+Math.random()*8;
      await drawOn(el('path',{d:`M ${x+Math.cos(a)*r1} ${y-Math.sin(a)*r1} L ${x+Math.cos(a)*r2} ${y-Math.sin(a)*r2}`,
        fill:'none',stroke:'#e8730c','stroke-width':4,'stroke-linecap':'round'}),160,g); } },
  async highlight(c){ // marker swipe under/behind a phrase
    const {x=700,y=400,w=260}=c;
    const h=el('path',{d:`M ${x} ${y} Q ${x+w/2} ${y-6+Math.random()*12} ${x+w} ${y}`,
      fill:'none',stroke:'#ffd9ad','stroke-width':34,'stroke-linecap':'round',opacity:0});
    h.classList.add('hiel');
    slideTarget().appendChild(h); h.style.transition='opacity .4s'; void h.getBoundingClientRect(); h.style.opacity=0.8;
    await sleep(300); },
  async flow(c){ // process chain: evenly spaced icon/box nodes with arrows — auto-aligned
    const items=(c.items||[]).slice(0,4); if(!items.length) return;
    const y=+c.y||470, n=items.length;
    const span=Math.min(1150,n*260), step=n>1?span/(n-1):0, x0=960-span/2;
    for(let i=0;i<n;i++){
      const cx=n>1?x0+i*step:960, it=items[i];
      if(i>0){ const px=x0+(i-1)*step; await H.arrow({x1:px+82,y1:y,x2:cx-82,y2:y,stroke:'#e8730c',width:4}); }
      if(it.icon&&ICONS[String(it.icon).toLowerCase()]) await H.icon({name:it.icon,x:cx,y:y,scale:1.15});
      else await drawOn(el('rect',{x:cx-85,y:y-42,width:170,height:84,rx:14,fill:'none',stroke:'#1c1c1c','stroke-width':4}));
      if(it.label) await writeOn(handText({x:cx,y:y+96,'text-anchor':'middle','font-size':28,fill:'#1c1c1c'},it.label));
    } },
  async compare(c){ // two columns + dashed divider: before/after, with/without, X vs Y
    const L=c.left||{}, R=c.right||{};
    await drawOn(el('path',{d:'M 960 260 C 954 380 966 520 960 640',fill:'none',stroke:'#c9c2b4','stroke-width':3,'stroke-dasharray':'2 11'}),500);
    const col=async(side,x,color)=>{ if(!side.title) return;
      await writeOn(handText({x,y:308,'text-anchor':'middle','font-size':42,fill:color,'font-weight':700},side.title,true));
      const lines=(side.lines||[]).slice(0,4);
      for(let i=0;i<lines.length;i++)
        await writeOn(handText({x,y:378+i*58,'text-anchor':'middle','font-size':29,fill:'#1c1c1c'},lines[i])); };
    await col(L,690,'#7a7164'); await col(R,1230,'#e8730c'); },
  async bars(c){ // quantities as hand-drawn bars, values written; biggest = orange
    const items=(c.items||[]).slice(0,4); if(!items.length) return;
    const max=Math.max(...items.map(i=>Math.abs(+i.value)||1));
    const y0=+c.y||380, x0=660;
    for(let i=0;i<items.length;i++){
      const it=items[i], y=y0+i*84, w=40+(Math.abs(+it.value)/max)*400;
      await writeOn(handText({x:x0-18,y:y+10,'text-anchor':'end','font-size':29,fill:'#1c1c1c'},it.label||''));
      await drawOn(el('path',{d:`M ${x0} ${y} L ${x0+w} ${y+(Math.random()*5-2.5)}`,fill:'none',
        stroke:(Math.abs(+it.value)===max)?'#e8730c':'#1c1c1c','stroke-width':32,'stroke-linecap':'round',opacity:.85}),620);
      await writeOn(handText({x:x0+w+20,y:y+10,'font-size':28,fill:'#7a7164'},String(it.unit!=null?it.value+' '+it.unit:it.value)));
    } },
  async callout(c){ // annotation: marker dot on a spot → curved line → short label
    const x=+c.x||800, y=+c.y||450, tx=+c.tx||1120, ty=+c.ty||300;
    await drawOn(el('circle',{cx:x,cy:y,r:8,fill:'none',stroke:'#e8730c','stroke-width':5}),200);
    await drawOn(el('path',{d:`M ${x} ${y} Q ${(x+tx)/2} ${(y+ty)/2-34} ${tx} ${ty}`,fill:'none',stroke:'#7a7164','stroke-width':3}),380);
    if(c.text) await writeOn(handText({x:tx+(tx>=x?12:-12),y:ty+8,'text-anchor':tx>=x?'start':'end','font-size':28,fill:'#1c1c1c'},c.text)); },
  async bignum(c){ // one striking number as the hero
    const x=+c.x||960, y=+c.y||440;
    await writeOn(handText({x,y,'text-anchor':'middle','font-size':112,fill:'#e8730c','font-weight':700},String(c.value??''),true));
    if(c.label) await writeOn(handText({x,y:y+66,'text-anchor':'middle','font-size':33,fill:'#7a7164'},c.label)); },
  async pause(c){ await sleep(Math.min(3000,c.ms||700)); },
  async done(){ await lineDone;
    centerSlide(liveSlide);
    pose('happy'); sparkle(); await sleep(700); say.classList.remove('on');
    if(slides.length>1) setStatus('👋 wave to flip · or say "explain slide 2 again"');
    const i=Math.floor(Math.random()*4);
    const url=VOICES&&VOICES.next?VOICES.next[i]:null;
    await speakLine(["Done! What should I draw next?","What else should I explain?","Ask me another one!","Next topic — I'm listening!"][i],url);
    armListen(); },
  async _reset(){ resetShow(); },
  async goto(c){ const i=Math.max(0,Math.min(slides.length-1,+c.slide||0));
    nav(i, i>cur?1:(i<cur?-1:0)); if(slides[i]) liveSlide=slides[i]; await sleep(600); },
  async _listen(){ armListen(); },
  async _voices(c){ VOICES=c; },
  async _status(c){
    if(c.state==='transcribing'){ setStatus('👂 got it — transcribing…'); }
    if(c.state==='heard'){ say.classList.add('you','on'); sayText.textContent='🎤 “'+c.text+'”'; setStatus(''); }
    if(c.state==='thinking'){ pose('think'); setStatus('✏️ thinking…'); }
    if(c.state==='drawing'){ setStatus(''); say.classList.remove('you'); }
  },
};
const GREETING="Hey! I'm inkling. Ask me anything — just talk, and I'll draw it for you!";

/* ---------- queue player ---------- */
const q=[]; let playing=false;
const DRAWY=new Set(['icon','path','rect','circle','arrow','text','note','step','wash','highlight','accent','flow','compare','bars','callout','bignum']);
async function pump(){ if(playing) return; playing=true;
  while(q.length){ const c=q.shift(); const h=H[c.op]; if(h){ try{ await h(c);}catch(e){console.warn(e);} }
    if(DRAWY.has(c.op)) centerSlide(liveSlide);   /* live re-centering: every stroke re-balances the slide */ }
  playing=false; }
window.__inject=(ops)=>{ops.forEach(o=>q.push(o));pump();};
const ws=new WebSocket(`ws://${location.host}/ws`);
ws.onmessage=ev=>{ try{ q.push(JSON.parse(ev.data)); pump(); }catch(e){} };

/* ---------- camera + HAND GESTURES (MediaPipe, fully local) ---------- */
let camStream=null, landmarker=null, gestureOn=false;
window.__gestureReady=false;
async function initGestures(){
  if(landmarker) return true;
  try{
    const mod=await import('/vendor/tasks-vision/vision_bundle.mjs');
    const files=await mod.FilesetResolver.forVisionTasks('/vendor/tasks-vision/wasm');
    landmarker=await mod.HandLandmarker.createFromOptions(files,{
      baseOptions:{modelAssetPath:'/models/hand_landmarker.task'},
      numHands:1, runningMode:'VIDEO'});
    window.__gestureReady=true;
    console.log('[gesture] hand tracking ready');
    return true;
  }catch(e){ console.warn('[gesture] init failed:',e.message); return false; }
}
function gestureLoop(){
  if(gestureOn) return; gestureOn=true;
  const hist=[]; let cool=0;
  const tick=()=>{
    if(!camStream){ gestureOn=false; return; }
    if(landmarker && camvid.videoWidth){
      try{
        const r=landmarker.detectForVideo(camvid,performance.now());
        if(r.landmarks && r.landmarks.length){
          const x=r.landmarks[0][9].x;                      /* middle-finger base = stable */
          const now=performance.now();
          hist.push({t:now,x});
          while(hist.length&&now-hist[0].t>450) hist.shift();
          if(now>cool && hist.length>3){
            const dx=hist[hist.length-1].x-hist[0].x;
            if(Math.abs(dx)>0.22){
              /* video is mirrored on screen: raw dx<0 = hand moved screen-right = NEXT */
              nav(cur+(dx<0?1:-1), dx<0?1:-1);
              cool=now+900; hist.length=0;
            }
          }
        } else hist.length=0;
      }catch(e){}
    }
    setTimeout(tick,66);
  };
  tick();
}
async function toggleCam(){
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null;
    stagewrap.classList.remove('camon'); document.getElementById('cam').classList.remove('on'); return; }
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720},audio:false});
    camvid.srcObject=camStream; stagewrap.classList.add('camon'); document.getElementById('cam').classList.add('on');
    initGestures().then(ok=>{ if(ok) gestureLoop(); });
  }catch(e){ setStatus('camera blocked: '+e.name); setTimeout(()=>setStatus(''),2500); }
}
document.getElementById('cam').onclick=toggleCam;
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){ nav(cur+1,1); }
  if(e.key==='ArrowLeft'){ nav(cur-1,-1); }
});
function grabFrame(){
  if(!camStream) return null;
  const c=document.createElement('canvas'); c.width=camvid.videoWidth||640; c.height=camvid.videoHeight||480;
  c.getContext('2d').drawImage(camvid,0,0);
  return c.toDataURL('image/jpeg',0.85);
}

/* ---------- hands-free voice loop (VAD) ---------- */
let micStream=null, analyser=null, vadArmed=false, rec=null, chunks=[];
function armListen(){ vadArmed=true; pose('idle'); setStatus('🎙 just talk — I\'m listening'); }
function disarm(){ vadArmed=false; hearing.classList.remove('on'); }
async function sendUtterance(blob){
  if(blob.size<4500){ armListen(); return; }
  disarm(); setStatus('👂 got it…');
  const fr=new FileReader();
  const dataUrl=await new Promise(r=>{ fr.onload=()=>r(fr.result); fr.readAsDataURL(blob); });
  say.classList.remove('on');
  await fetch('/ask-voice',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({audio:dataUrl,frame:grabFrame(),cur})});
}
window.__sendVoice=async(dataUrl)=>{ disarm();
  await fetch('/ask-voice',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({audio:dataUrl,frame:grabFrame(),cur})}); };
function vadLoop(){
  const buf=new Float32Array(analyser.fftSize);
  let capturing=false, speechMs=0, silenceMs=0, capMs=0, last=performance.now();
  setInterval(()=>{
    const now=performance.now(), dt=now-last; last=now;
    if(!vadArmed || speaking){ speechMs=silenceMs=0;
      if(capturing){ try{rec.stop();}catch(e){} capturing=false; hearing.classList.remove('on'); } return; }
    analyser.getFloatTimeDomainData(buf);
    let s=0; for(let i=0;i<buf.length;i++) s+=buf[i]*buf[i];
    const rms=Math.sqrt(s/buf.length);
    if(rms>0.013){ speechMs+=dt; silenceMs=0; } else { silenceMs+=dt; if(!capturing) speechMs=0; }
    if(!capturing && speechMs>260){
      capturing=true; capMs=0; chunks=[];
      rec=new MediaRecorder(micStream,{mimeType:'audio/webm'});
      rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
      rec.onstop=()=>{ sendUtterance(new Blob(chunks,{type:'audio/webm'})); };
      rec.start();
      hearing.classList.add('on'); setStatus('🔴 listening — pause when done',true);
    }
    if(capturing){ capMs+=dt;
      if(silenceMs>1500 || capMs>25000){ capturing=false; hearing.classList.remove('on'); try{rec.stop();}catch(e){} }
    }
  },80);
}

/* ---------- one tap → hands-free forever ---------- */
splash.addEventListener('click', async ()=>{
  splash.classList.add('gone');
  try{ micStream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ setStatus('mic blocked — allow the microphone and reload'); return; }
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const src=ctx.createMediaStreamSource(micStream);
  analyser=ctx.createAnalyser(); analyser.fftSize=2048; src.connect(analyser);
  vadLoop();
  pose('wave');
  await speakLine(GREETING, VOICES&&VOICES.greeting?VOICES.greeting:null);
  armListen();
});
